<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard | StudentResult</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><h1>🎓 Student Result Management System</h1></header>
  <nav class="nav">
    <span class="muted">Student Panel</span>
    <span class="spacer"></span>
    <button id="logoutBtn" class="btn small danger" type="button">Logout</button>
  </nav>
  <main>
    <div class="card">
      <div class="row">
        <h2>My Result Card</h2>
        <button class="btn small no-print" onclick="window.print()">🖨 Print</button>
      </div>
      <div id="info" class="info"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Subject</th><th>Marks Obtained</th><th>Max Marks</th></tr></thead>
          <tbody id="rows"><tr><td colspan="3" class="muted">Loading...</td></tr></tbody>
        </table>
      </div>
      <div id="totals" class="totals"></div>
    </div>
  </main>
  <script type="module" src="js/student-dashboard.js"></script>
</body>
</html>
