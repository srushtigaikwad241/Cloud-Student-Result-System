<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter Marks | StudentResult</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><h1>🎓 Student Result Management System</h1></header>
  <nav class="nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="add-student.html">Add Student</a>
    <a href="students.html">Students</a>
    <a href="subjects.html">Subjects</a>
    <a href="enter-marks.html">Enter Marks</a>
    <a href="results.html">Results</a>
    <span class="spacer"></span>
    <button id="logoutBtn" class="btn small danger" type="button">Logout</button>
  </nav>
  <main>
    <div class="card">
      <h2>Enter Marks</h2>
      <form id="marksForm" class="two">
        <div><label for="student">Student</label><select id="student"></select></div>
        <div><label for="subject">Subject</label><select id="subject"></select></div>
        <div><label for="marks">Marks Obtained</label><input id="marks" type="number" step="0.01" min="0" required /></div>
        <div style="align-self:end"><button class="btn" type="submit" style="margin-top:0">Save Marks</button></div>
      </form>
    </div>
    <div class="card">
      <h2>Marks of selected student</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Subject</th><th>Marks</th><th>Max</th><th>Action</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="muted">Select a student.</td></tr></tbody>
        </table>
      </div>
      <p id="summary" class="summary"></p>
    </div>
  </main>
  <script type="module" src="js/enter-marks.js"></script>
</body>
</html>
