<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Student | StudentResult</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><h1>🎓 Student Result Management System</h1></header>
  <nav class="nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="add-student.html">Add Student</a>
    <a href="students.html">Students</a>
    <a href="subjects.html">Subjects</a>
    <a href="enter-marks.html">Enter Marks</a>
    <a href="results.html">Results</a>
    <span class="spacer"></span>
    <button id="logoutBtn" class="btn small danger" type="button">Logout</button>
  </nav>
  <main>
    <section class="card narrow" style="margin-top:0">
      <h2>Add Student</h2>
      <form id="studentForm">
        <label for="roll">Roll Number <span class="muted">(letters/numbers only, used to log in)</span></label>
        <input id="roll" required />

        <label for="name">Full Name</label>
        <input id="name" required />

        <label for="email">Email <span class="muted">(optional, saved in records)</span></label>
        <input id="email" type="email" placeholder="student@gmail.com" />

        <label for="course">Course / Class</label>
        <input id="course" placeholder="e.g. BCA - Sem 3" />

        <label for="password">Password <span class="muted">(min 6 characters)</span></label>
        <input id="password" type="text" required minlength="6" />

        <button id="addBtn" class="btn" type="submit">Add Student</button>
      </form>
    </section>
  </main>
  <script type="module" src="js/add-student.js"></script>
</body>
</html>
