<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | StudentResult</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><h1>🎓 Student Result Management System</h1></header>
  <main>
    <section class="card narrow">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <button id="loginBtn" class="btn" type="submit">Login</button>
      </form>
      <p><a href="index.html">&larr; Home</a> | <a href="student-login.html">Student login</a></p>
    </section>
  </main>
  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
