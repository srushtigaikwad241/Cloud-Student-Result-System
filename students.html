<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Students | StudentResult</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"><h1>🎓 Student Result Management System</h1></header>
  <nav class="nav">
    <a href="admin-dashboard.html">Dashboard</a>
    <a href="add-student.html">Add Student</a>
    <a href="students.html">Students</a>
    <a href="subjects.html">Subjects</a>
    <a href="enter-marks.html">Enter Marks</a>
    <a href="results.html">Results</a>
    <span class="spacer"></span>
    <button id="logoutBtn" class="btn small danger" type="button">Logout</button>
  </nav>
  <main>
    <div class="card">
      <div class="row">
        <h2>Students <span id="count" class="muted"></span></h2>
        <input id="search" class="search" placeholder="Search name or roll no..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Roll No</th>
              <th>Name</th>
              <th>Email</th>
              <th>Course</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="5" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script type="module" src="js/students.js"></script>
</body>
</html>
